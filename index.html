// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

      flex-shrink: 0;
    }
    .nav-monogram:hover { color: var(--red); }

    .nav-search {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-light);
      padding: 10px 12px;
      transition: color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-search:hover { color: var(--red); }
    .nav-search svg { display: block; }

    /* ── SEARCH OVERLAY ──────────────────────────────── */
    .search-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(26,23,20,0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 120px;
      backdrop-filter: blur(2px);
      animation: fadeIn 0.18s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .search-box {
      background: var(--cream);
      width: 100%;
      max-width: 680px;
      border: var(--rule);
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }

    .search-input-row {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 24px;
      border-bottom: var(--rule);
    }

    .search-input-row svg { flex-shrink: 0; color: var(--ink-faint); }

    .search-input {
      flex: 1;
      border: none;
      background: none;
      font-family: var(--serif);
      font-size: 22px;
      color: var(--ink);
      padding: 22px 16px;
      outline: none;
    }

    .search-input::placeholder { color: var(--ink-faint); font-style: italic; }

    .search-close {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-faint);
      padding: 8px 0;
      transition: color 0.15s;
    }
    .search-close:hover { color: var(--red); }

    .search-results {
      max-height: 420px;
      overflow-y: auto;
    }

    .search-result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 24px;
      border-bottom: var(--rule);
      cursor: pointer;
      transition: background 0.12s;
    }

    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--cream-dark); }
    .search-result-item:hover .sr-title { color: var(--red); }

    .sr-cat {
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 3px;
    }

    .sr-title {
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.3;
      transition: color 0.15s;
    }

    .sr-sub {
      font-family: var(--sans);
      font-size: 10px;
      color: var(--ink-faint);
      margin-top: 2px;
    }

    .sr-score {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .search-empty {
      padding: 32px 24px;
      font-family: var(--serif);
      font-style: italic;
      font-size: 16px;
      color: var(--ink-faint);
    }

    .search-hint {
      padding: 14px 24px;
      font-family: var(--sans);
      font-size: 9.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    /* ── PAGE WRAPPER ──────────────────────────────── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── HOMEPAGE HERO ──────────────────────────────── */
    .hero-wrap {
      padding: 0 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 400px;
      height: 600px;
      border-top: var(--rule);
    }

    /* The left panel holds all image slots stacked; only the active one is visible */
    .hero-image-wrap {
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
    }

    .hero-slide.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .hero-placeholder {
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        45deg,
        #d0c8bc,
        #d0c8bc 2px,
        #ddd6cc 2px,
        #ddd6cc 18px
      );
      display: flex;
      align-items: flex-end;
      padding: 24px;
    }

    /* Each slide has its own subtle tint so they feel distinct */
    .hero-slide:nth-child(1) .hero-placeholder { background: repeating-linear-gradient(45deg,#ccc5b8 2px,#d9d2c8 2px,#d9d2c8 18px); }
    .hero-slide:nth-child(2) .hero-placeholder { background: repeating-linear-gradient(135deg,#c8ccc5 2px,#d4d8d2 2px,#d4d8d2 18px); }
    .hero-slide:nth-child(3) .hero-placeholder { background: repeating-linear-gradient(45deg,#c5c0bb 2px,#d0ccc8 2px,#d0ccc8 18px); }
    .hero-slide:nth-child(4) .hero-placeholder { background: repeating-linear-gradient(135deg,#cdc8c2 2px,#dad5ce 2px,#dad5ce 18px); }
    .hero-slide:nth-child(5) .hero-placeholder { background: repeating-linear-gradient(45deg,#c4c8cb 2px,#d0d4d7 2px,#d0d4d7 18px); }

    .hero-placeholder-label {
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--ink-light);
      text-transform: uppercase;
    }

    /* Info strip at bottom of image */
    .hero-image-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(18,14,10,0.78));
      padding: 48px 32px 28px;
    }

    .hero-image-tag {
      font-family: var(--sans);
      font-size: 9.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      margin-bottom: 8px;
    }

    .hero-image-title {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      color: #fff;
      line-height: 1.2;
      text-wrap: pretty;
    }

    .hero-image-score {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,180,160,0.95);
      margin-top: 10px;
    }

    /* ── HERO SIDEBAR ──────────────────────────────── */
    .hero-sidebar {
      border-left: var(--rule);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .hero-sidebar-item {
      padding: 24px 28px;
      border-bottom: var(--rule);
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-sidebar-item:last-child { border-bottom: none; }

    .hero-sidebar-item.hovered,
    .hero-sidebar-item:hover { background: var(--cream-dark); }

    .sidebar-tag {
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 5px;
    }

    .sidebar-title {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .sidebar-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 7px;
    }

    .sidebar-byline {
      font-family: var(--sans);
      font-size: 9.5px;
      letter-spacing: 0.03em;
      color: var(--ink-faint);
    }

    .sidebar-score {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--red);
    }



    /* ── RECENT — two-column card grid ──────────────────────────────── */
    .section-header {
      padding: 96px 80px 36px;
      display: flex;
      align-items: baseline;
      gap: 20px;
      border-top: var(--rule);
    }

    .section-title {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-mid);
    }

    .recent-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px 72px;
      padding: 48px 80px 96px;
      border-bottom: var(--rule);
    }

    .recent-card2 {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .recent-card2:hover .rc2-img { opacity: 0.88; }
    .recent-card2:hover .rc2-title { color: var(--red); }

    .rc2-img {
      width: 100%;
      aspect-ratio: 3/2;
      background: repeating-linear-gradient(
        45deg,
        #ccc5b8 2px,
        #d9d2c8 2px,
        #d9d2c8 16px
      );
      display: flex;
      align-items: flex-end;
      padding: 10px 12px;
      margin-bottom: 18px;
      transition: opacity 0.2s;
    }

    .rc2-img.alt {
      background: repeating-linear-gradient(
        135deg,
        #c5c9c7 2px,
        #d2d6d4 2px,
        #d2d6d4 16px
      );
    }

    .rc2-img-label {
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--ink-light);
      white-space: nowrap;
    }

    .rc2-cat {
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 10px;
    }

    .rc2-title {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 400;
      line-height: 1.22;
      margin-bottom: 10px;
      transition: color 0.18s;
      text-wrap: pretty;
    }

    .rc2-sub {
      font-family: var(--sans);
      font-size: 10px;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }

    .rc2-excerpt {
      font-family: var(--serif);
      font-size: 15px;
      font-style: italic;
      color: var(--ink-mid);
      line-height: 1.6;
      margin-bottom: 16px;
      text-wrap: pretty;
    }

    .rc2-foot {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: auto;
      padding-top: 14px;
      border-top: var(--rule);
    }

    .rc2-date {
      font-family: var(--sans);
      font-size: 10px;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
    }

    .rc2-score {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
      white-space: nowrap;
    }

    /* ── CATEGORY PAGE ──────────────────────────────── */
    .category-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 140px);
    }

    .category-sidebar {
      border-right: var(--rule);
      padding: 36px 32px;
    }

    .filter-label {
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: var(--rule);
    }

    .filter-group { margin-bottom: 32px; }

    .filter-item {
      font-family: var(--sans);
      font-size: 11.5px;
      letter-spacing: 0.04em;
      color: var(--ink-mid);
      padding: 5px 0;
      cursor: pointer;
      transition: color 0.15s;
      display: block;
    }

    .filter-item:hover { color: var(--ink); }
    .filter-item.active { color: var(--red); font-style: italic; }

    .category-main {
      padding: 36px 48px;
    }

    .cat-page-title {
      font-family: var(--serif);
      font-size: 42px;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      line-height: 1;
    }

    .cat-page-subtitle {
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 32px;
    }

    .review-list-item {
      display: grid;
      grid-template-columns: 80px 1fr 80px;
      gap: 24px;
      align-items: start;
      padding: 22px 0;
      border-bottom: var(--rule);
      cursor: pointer;
      transition: background 0.12s;
    }

    .review-list-item:hover { margin: 0 -16px; padding-left: 16px; padding-right: 16px; background: var(--cream-dark); }

    .review-thumb {
      width: 80px;
      height: 80px;
      object-fit: cover;
      display: block;
    }

    .review-thumb-placeholder {
      width: 80px;
      height: 80px;
      background: repeating-linear-gradient(
        45deg,
        #d0c8bc,
        #d0c8bc 1px,
        #ddd6cc 1px,
        #ddd6cc 8px
      );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .review-info {}
    .review-list-title {
      font-family: var(--serif);
      font-size: 21px;
      font-weight: 400;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .review-list-sub {
      font-family: var(--sans);
      font-size: 10px;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .review-list-excerpt {
      font-family: var(--serif);
      font-size: 14px;
      font-style: italic;
      color: var(--ink-mid);
      line-height: 1.5;
    }

    .review-list-score {
      font-family: var(--sans);
      font-size: 20px;
      font-weight: 600;
      color: var(--red);
      text-align: right;
      padding-top: 2px;
    }

    .review-list-year {
      font-family: var(--sans);
      font-size: 10px;
      color: var(--ink-faint);
      text-align: right;
      margin-top: 4px;
    }

    /* ── REVIEW PAGE ──────────────────────────────── */
    .review-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      max-width: 1100px;
      margin: 0 auto;
      gap: 0;
    }

    .review-body {
      padding: 48px 64px 80px 48px;
      border-right: var(--rule);
    }

    .review-kicker {
      font-family: var(--sans);
      font-size: 9.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 14px;
    }

    .review-title {
      font-family: var(--serif);
      font-size: 48px;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }

    .review-subtitle {
      font-family: var(--serif);
      font-size: 20px;
      font-style: italic;
      color: var(--ink-mid);
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .review-byline-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: var(--rule);
      border-bottom: var(--rule);
      padding: 10px 0;
      margin-bottom: 28px;
    }

    .review-byline {
      font-family: var(--sans);
      font-size: 10.5px;
      letter-spacing: 0.05em;
      color: var(--ink-light);
    }

    .review-byline strong { color: var(--red); font-weight: 500; }

    .review-score-display {
      font-family: var(--sans);
      font-size: 22px;
      font-weight: 700;
      color: var(--red);
      letter-spacing: -0.02em;
    }

    .review-score-label {
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-faint);
      text-align: right;
    }

    .review-hero-image {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      margin-bottom: 10px;
    }

    .review-hero-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: repeating-linear-gradient(
        45deg,
        #ccc4b8,
        #ccc4b8 2px,
        #d8d0c4 2px,
        #d8d0c4 18px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .review-image-caption {
      font-family: var(--sans);
      font-size: 10px;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
      margin-bottom: 32px;
    }

    .review-text {
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1.75;
      color: var(--ink);
      text-wrap: pretty;
    }

    .review-text p { margin-bottom: 22px; }

    .review-text p:first-child::first-letter {
      font-size: 4.2em;
      float: left;
      line-height: 0.8;
      margin: 0.06em 0.08em 0 0;
      font-weight: 600;
      color: var(--red);
    }

    /* ── REVIEW ASIDE ──────────────────────────────── */
    .review-aside {
      padding: 48px 32px;
    }

    .aside-section {
      margin-bottom: 36px;
      padding-bottom: 32px;
      border-bottom: var(--rule);
    }

    .aside-section:last-child { border-bottom: none; }

    .aside-label {
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 14px;
    }

    .aside-score-big {
      font-family: var(--serif);
      font-size: 72px;
      font-weight: 400;
      color: var(--red);
      line-height: 1;
      margin-bottom: 4px;
    }

    .aside-score-denom {
      font-family: var(--sans);
      font-size: 12px;
      color: var(--ink-faint);
    }

    .aside-details dt {
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-top: 14px;
    }

    .aside-details dd {
      font-family: var(--serif);
      font-size: 15px;
      color: var(--ink-mid);
      margin-top: 2px;
    }

    .you-might-like-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: var(--rule);
      cursor: pointer;
      transition: background 0.12s;
    }

    .you-might-like-item:last-child { border-bottom: none; }
    .you-might-like-item:hover .yml-title { color: var(--red); }

    .yml-thumb {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      background: repeating-linear-gradient(
        45deg,
        #ccc4b8,
        #ccc4b8 1px,
        #d8d0c4 1px,
        #d8d0c4 7px
      );
    }

    .yml-title {
      font-family: var(--serif);
      font-size: 14px;
      line-height: 1.3;
      transition: color 0.15s;
    }

    .yml-meta {
      font-family: var(--sans);
      font-size: 9.5px;
      color: var(--ink-faint);
      margin-top: 3px;
    }

    .yml-score {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      color: var(--red);
      margin-top: 3px;
    }

    /* ── FOOTER ──────────────────────────────── */
    .site-footer {
      border-top: var(--rule);
    }

    .footer-illustration {
      width: 100%;
      overflow: hidden;
      display: block;
      background: var(--cream);
      border-bottom: var(--rule);
    }

    .footer-illustration svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .footer-bottom {
      padding: 24px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-name {
      font-family: var(--serif);
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-light);
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .footer-link {
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-faint);
      cursor: pointer;
      transition: color 0.15s;
      text-decoration: none;
    }

    .footer-link:hover { color: var(--red); }

    .footer-copy {
      font-family: var(--sans);
      font-size: 10px;
      color: var(--ink-faint);
      letter-spacing: 0.05em;
    }

    /* ── ABOUT PAGE ──────────────────────────────── */
    .about-layout {
      max-width: 740px;
      margin: 0 auto;
      padding: 80px 48px 120px;
    }

    .about-kicker {
      font-family: var(--sans);
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 20px;
    }

    .about-title {
      font-family: var(--serif);
      font-size: 52px;
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin-bottom: 32px;
    }

    .about-rule {
      border: none;
      border-top: var(--rule);
      margin-bottom: 40px;
    }

    .about-body {
      font-family: var(--serif);
      font-size: 20px;
      line-height: 1.78;
      color: var(--ink);
      text-wrap: pretty;
    }

    .about-body p {
      margin-bottom: 28px;
    }

    .about-body p:first-child::first-letter {
      font-size: 4em;
      float: left;
      line-height: 0.82;
      margin: 0.06em 0.1em 0 0;
      font-weight: 600;
      color: var(--red);
    }

    .about-footer-line {
      display: flex;
      align-items: center;

function WriteReviewPage({ onSuccess, onCancel }) {
  const emptyForm = { cat: 'Movies', title: '', sub: '', score: '', year: new Date().getFullYear(), excerpt: '', body: '' };
  const [form, setForm] = useState(emptyForm);
  const [imageFile, setImageFile] = useState(null);
  const [imagePreview, setImagePreview] = useState(null);
  const [status, setStatus] = useState('idle');
  const [errorMsg, setErrorMsg] = useState('');

  const set = (key, val) => setForm(f => ({ ...f, [key]: val }));

  const handleImageChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImageFile(file);
    setImagePreview(URL.createObjectURL(file));
  };

  const removeImage = () => { setImageFile(null); setImagePreview(null); };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setStatus('uploading');
    setErrorMsg('');

    let image_url = null;
    if (imageFile) {
      const ext = imageFile.name.split('.').pop();
      const filename = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
      const { error: uploadErr } = await sb.storage
        .from('review-images')
        .upload(filename, imageFile, { contentType: imageFile.type });
      if (uploadErr) {
        setStatus('error');
        setErrorMsg('Image upload failed: ' + uploadErr.message);
        return;
      }
      const { data: urlData } = sb.storage.from('review-images').getPublicUrl(filename);
      image_url = urlData.publicUrl;
    }

    const { data, error: insertErr } = await sb.from('reviews').insert({
      cat: form.cat,
      title: form.title.trim(),
      sub: form.sub.trim(),
      score: parseFloat(form.score),
      year: parseInt(form.year),
      excerpt: form.excerpt.trim(),
      body: form.body.trim(),
      image_url,
    }).select().single();

    if (insertErr) {
      setStatus('error');
      setErrorMsg('Could not save review: ' + insertErr.message);
      return;
    }

    setStatus('idle');
    setForm(emptyForm);
    setImageFile(null);
    setImagePreview(null);
    onSuccess(normalizeReview(data));
  };

  return (
    <div className="write-layout">
      <div className="write-kicker">New Entry</div>
      <h1 className="write-title">Write a Review</h1>

            <select value={form.cat} onChange={e => set('cat', e.target.value)}>

            </select>
          </div>
          <div className="write-field">
            <label>Score <span className="write-field-hint">/ 10</span></label>
            <input type="number" min="0" max="10" step="0.1" value={form.score}
              onChange={e => set('score', e.target.value)} placeholder="9.2" required />
          </div>
        </div>

        <div className="write-field">
          <label>Title</label>
          <input type="text" value={form.title} onChange={e => set('title', e.target.value)}
            placeholder="e.g. Nebraska" required />
        </div>

        <div className="write-row-2col">
          <div className="write-field">
            <label>Subtitle <span className="write-field-hint">artist · director · maker</span></label>
            <input type="text" value={form.sub} onChange={e => set('sub', e.target.value)}
              placeholder="e.g. Bruce Springsteen, 1982" required />
          </div>
          <div className="write-field">
            <label>Year</label>
            <input type="number" min="1800" max="2100" value={form.year}
              onChange={e => set('year', e.target.value)} required />
          </div>
        </div>

        <div className="write-field">
          <label>Excerpt <span className="write-field-hint">1–2 sentences shown in previews</span></label>
          <textarea rows="3" value={form.excerpt} onChange={e => set('excerpt', e.target.value)}
            placeholder="A short, punchy summary…" required />
        </div>

        <div className="write-field">
          <label>Review</label>
          <textarea className="write-body" rows="18" value={form.body} onChange={e => set('body', e.target.value)}
            placeholder={"Write your full review here.\n\nSeparate paragraphs with a blank line."} required />
        </div>

        <div className="write-field">
          <label>Image</label>
          <label className="write-image-label">
            {imagePreview
              ? <img src={imagePreview} alt="Preview" className="write-image-preview-img" />
              : <div className="write-image-empty">
                  <span className="write-image-icon">+</span>
                  <span>Click to browse</span>
                </div>
            }
            <input type="file" accept="image/*" onChange={handleImageChange} style={{display:'none'}} />
          </label>
          {imageFile && (
            <button type="button" className="write-remove-img" onClick={removeImage}>Remove image</button>
          )}
        </div>

        <div className="write-actions">
          <button type="button" className="write-cancel" onClick={onCancel}>Cancel</button>
          <button type="submit" className="write-submit" disabled={status === 'uploading'}>
            {status === 'uploading' ? 'Publishing…' : 'Publish Review'}
          </button>
        </div>
      </form>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = useState("home");
  const [activeCat, setActiveCat] = useState("Movies");
  const [activeReview, setActiveReview] = useState(null);
  const [filterYear, setFilterYear] = useState(null);
  const [filterSort, setFilterSort] = useState("name");
  const [hoveredHero, setHoveredHero] = useState(null);
  const [searchOpen, setSearchOpen] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");
  const searchInputRef = React.useRef(null);

  // ── Auth ──
  const [session, setSession] = useState(null);
  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => setSession(session));
    const { data: { subscription } } = sb.auth.onAuthStateChange((_e, session) => setSession(session));
    return () => subscription.unsubscribe();
  }, []);
  const handleSignOut = async () => { await sb.auth.signOut(); goHome(); };

  // ── Reviews from Supabase (falls back to seed data while loading) ──
  const [reviews, setReviews] = useState(SEED_REVIEWS);
  const [loading, setLoading] = useState(true);

  const fetchReviews = async () => {
    const { data, error } = await sb.from('reviews').select('*').order('created_at', { ascending: false });
    if (!error) {
      setReviews(data && data.length > 0 ? data.map(normalizeReview) : SEED_REVIEWS);
    }
    setLoading(false);
  };

  useEffect(() => { fetchReviews(); }, []);

  // Open/close search
  const openSearch = () => { setSearchOpen(true); setSearchQuery(""); };
  const closeSearch = () => { setSearchOpen(false); setSearchQuery(""); };

  useEffect(() => {
    if (searchOpen && searchInputRef.current) {
      setTimeout(() => searchInputRef.current.focus(), 50);
    }
  }, [searchOpen]);

  useEffect(() => {
    const handler = (e) => { if (e.key === "Escape") closeSearch(); };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, []);

  const searchResults = searchQuery.trim().length > 0
    ? reviews.filter(r => {
        const q = searchQuery.toLowerCase();
        return r.title.toLowerCase().includes(q)
          || r.sub.toLowerCase().includes(q)
          || r.cat.toLowerCase().includes(q)
          || r.excerpt.toLowerCase().includes(q);
      })
    : [];

  const accent = tweaks.accentColor;
  const bg = tweaks.bgColor;

  useEffect(() => {
    document.documentElement.style.setProperty('--red', accent);
    document.documentElement.style.setProperty('--red-light', accent);
    document.documentElement.style.setProperty('--cream', bg);
    document.documentElement.style.setProperty('--cream-dark', adjustColor(bg, -8));
  }, [accent, bg]);

  function adjustColor(hex, amount) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    const clamp = v => Math.max(0, Math.min(255, v));
    return `rgb(${clamp(r+amount)},${clamp(g+amount)},${clamp(b+amount)})`;
  }

  const goHome  = () => { setPage("home");     setActiveReview(null); };
  const goCat   = (cat) => { setActiveCat(cat); setPage("category"); setActiveReview(null); setFilterYear(null); };
  const goReview = (review) => { setActiveReview(review); setPage("review"); window.scrollTo(0,0); };
  const goAbout = () => { setPage("about"); setActiveReview(null); };
  const goWrite = () => { setPage("write"); setActiveReview(null); window.scrollTo(0,0); };

  const handleReviewPublished = (newReview) => {
    fetchReviews();
    goReview(newReview);
  };

  const recentReviews = [...reviews].sort((a,b) => b.id - a.id);
  const heroItems = recentReviews.slice(0, 5);
  const heroMain = heroItems[0];
  const heroSide = heroItems.slice(1, 5);
  const activeHeroItem = hoveredHero
    ? (heroItems.find(r => r.id === hoveredHero) || heroMain)
    : heroMain;

  const catReviews = reviews.filter(r => r.cat === activeCat);
  const years = [...new Set(catReviews.map(r => r.year))].sort((a,b) => b-a);

  let filtered = filterYear ? catReviews.filter(r => r.year === filterYear) : catReviews;
  if (filterSort === "name") filtered = [...filtered].sort((a,b) => a.title.localeCompare(b.title));
  else filtered = [...filtered].sort((a,b) => b.year - a.year);

  const relatedReviews = activeReview
    ? reviews.filter(r => r.id !== activeReview.id && r.cat === activeReview.cat).slice(0,3)
    : [];

  return (
    <>
      {/* ── HEADER ── */}
      <header className="site-header">
        <div className="header-top">
          <div className="masthead" style={{fontSize: tweaks.mastheadSize}} onClick={goHome}>
            The&nbsp;&nbsp;Edward&nbsp;&nbsp;Review
          </div>
          <div className="header-util">
            <a onClick={goAbout} style={{cursor:"pointer"}}>About</a>
            <a onClick={goWrite} style={{cursor:"pointer"}}>{session ? "Write" : "Sign In"}</a>
            {session && <a onClick={handleSignOut} style={{cursor:"pointer"}}>Sign Out</a>}
          </div>
        </div>
        <nav className="main-nav">
          {/* Monogram mark */}
          <div className="nav-monogram" onClick={goHome} title="Home">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="11" r="10" stroke="currentColor" strokeWidth="1.2"/>
              <text x="11" y="15" textAnchor="middle" fontFamily="'EB Garamond', Georgia, serif" fontSize="11" fill="currentColor" fontWeight="500">E</text>
            </svg>
          </div>
          {CATEGORIES.map(cat => (
            <div
              key={cat}
              className={`nav-item ${page === "category" && activeCat === cat ? "active" : ""}`}
              onClick={() => goCat(cat)}
            >{cat}</div>
          ))}
          <button className="nav-search" title="Search" onClick={openSearch}>
            <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round">
              <circle cx="7.5" cy="7.5" r="5.5"/>
              <line x1="11.5" y1="11.5" x2="16" y2="16"/>
            </svg>
          </button>
        </nav>
      </header>

      {/* ── HOME ── */}
      {page === "home" && (
        <>
          {/* Hero */}
          <div className="hero-wrap">
          <section className="hero">
            {/* Left: stacked slides, crossfade on hover */}
            <div className="hero-image-wrap" onClick={() => goReview(activeHeroItem)}>
              {heroItems.map((r) => (
                <div
                  key={r.id}
                  className={`hero-slide ${activeHeroItem.id === r.id ? "visible" : ""}`}
                >
                  {r.image_url
                    ? <img src={r.image_url} alt={r.title} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}} />
                    : <div className="hero-placeholder" style={{height:"100%"}}>
                        <span className="hero-placeholder-label">{r.cat} · image placeholder</span>
                      </div>
                  }
                  <div className="hero-image-info">
                    <div className="hero-image-tag">{r.cat}</div>
                    <div className="hero-image-title">{r.title}</div>
                    {tweaks.showScores && <div className="hero-image-score">{r.score} / 10</div>}
                  </div>
                </div>
              ))}
            </div>

            {/* Right sidebar */}
            <div className="hero-sidebar">
              {/* First item = most recent, dark featured style */}
              <div
                className={`hero-sidebar-item ${hoveredHero === heroMain.id ? "hovered" : ""}`}
                onClick={() => goReview(heroMain)}
                onMouseEnter={() => setHoveredHero(heroMain.id)}
                onMouseLeave={() => setHoveredHero(null)}
              >
                <div className="sidebar-tag">{heroMain.cat}</div>
                <div className="sidebar-title">{heroMain.title}</div>
                <div className="sidebar-meta">
                  <div className="sidebar-byline">{heroMain.sub}</div>
                  {tweaks.showScores && <div className="sidebar-score">{heroMain.score}</div>}
                </div>
              </div>

              {heroSide.map((r) => (
                <div
                  key={r.id}
                  className={`hero-sidebar-item ${hoveredHero === r.id ? "hovered" : ""}`}
                  onClick={() => goReview(r)}
                  onMouseEnter={() => setHoveredHero(r.id)}
                  onMouseLeave={() => setHoveredHero(null)}
                >
                  <div className="sidebar-tag">{r.cat}</div>
                  <div className="sidebar-title">{r.title}</div>
                  <div className="sidebar-meta">
                    <div className="sidebar-byline">{r.sub}</div>
                    {tweaks.showScores && <div className="sidebar-score">{r.score}</div>}
                  </div>
                </div>
              ))}


            </div>
          </section>
          </div>

          {/* Recent — two-column card grid, max 10 */}
          <div className="section-header">
            <div className="section-title">Latest</div>
          </div>
          <div className="recent-grid-2col">
            {recentReviews.slice(0, 10).map((r, i) => (
              <div key={r.id} className="recent-card2" onClick={() => goReview(r)}>
                <div className={`rc2-img${i % 2 === 1 ? " alt" : ""}`}>
                  {r.image_url
                    ? <img src={r.image_url} alt={r.title} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}} />
                    : <span className="rc2-img-label">{r.cat} · image</span>
                  }
                </div>
                <div className="rc2-cat">{r.cat}</div>
                <div className="rc2-title">{r.title}</div>
                <div className="rc2-sub">{r.sub}</div>
                <div className="rc2-excerpt">"{r.excerpt}"</div>
                <div className="rc2-foot">
                  <div className="rc2-date">{r.date}</div>
                  {tweaks.showScores && <div className="rc2-score">{r.score} / 10</div>}
                </div>
              </div>
            ))}
          </div>
        </>
      )}

      {/* ── CATEGORY ── */}
      {page === "category" && (
        <>
          <div className="breadcrumb">
            <span onClick={goHome}>Home</span>
            <span className="sep">—</span>
            <span>{activeCat}</span>
          </div>
          <div className="category-layout">
            {/* Sidebar filters */}
            <aside className="category-sidebar">
              <div className="filter-group">
                <div className="filter-label">Sort by</div>
                <div
                  className={`filter-item ${filterSort === "name" ? "active" : ""}`}
                  onClick={() => setFilterSort("name")}
                >Name</div>
                <div
                  className={`filter-item ${filterSort === "year" ? "active" : ""}`}
                  onClick={() => setFilterSort("year")}
                >Year</div>
              </div>
              <div className="filter-group">
                <div className="filter-label">Year</div>
                <div
                  className={`filter-item ${filterYear === null ? "active" : ""}`}
                  onClick={() => setFilterYear(null)}
                >All</div>
                {years.map(y => (
                  <div
                    key={y}
                    className={`filter-item ${filterYear === y ? "active" : ""}`}
                    onClick={() => setFilterYear(y)}
                  >{y}</div>
                ))}
              </div>
            </aside>

            {/* Main content */}
            <main className="category-main">
              <h1 className="cat-page-title">{activeCat}</h1>
              <div className="cat-page-subtitle">
                {filtered.length} review{filtered.length !== 1 ? "s" : ""}
                {filterYear ? ` · ${filterYear}` : ""}
              </div>

              {filtered.map(r => (
                <div key={r.id} className="review-list-item" onClick={() => goReview(r)}>
                  <div className="review-thumb-placeholder">
                    {r.image_url && <img src={r.image_url} alt={r.title} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}} />}
                  </div>
                  <div className="review-info">
                    <div className="review-list-title">{r.title}</div>
                    <div className="review-list-sub">{r.sub}</div>
                    <div className="review-list-excerpt">"{r.excerpt}"</div>
                  </div>
                  <div>
                    {tweaks.showScores && <div className="review-list-score">{r.score}</div>}
                    <div className="review-list-year">{r.year}</div>
                  </div>
                </div>
              ))}

              {filtered.length === 0 && (
                <div style={{padding: "40px 0", color: "var(--ink-faint)", fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 18}}>
                  No reviews for this filter yet.
                </div>
              )}
            </main>
          </div>
        </>
      )}

      {/* ── REVIEW PAGE ── */}
      {page === "review" && activeReview && (
        <>
          <div className="breadcrumb">
            <span onClick={goHome}>Home</span>
            <span className="sep">—</span>
            <span onClick={() => goCat(activeReview.cat)}>{activeReview.cat}</span>
            <span className="sep">—</span>
            <span>{activeReview.title}</span>
          </div>
          <div className="review-layout">
            <article className="review-body">
              <div className="review-kicker">{activeReview.cat} Review</div>
              <h1 className="review-title" style={{fontSize: tweaks.bodySize * 2.4}}>{activeReview.title}</h1>
              <div className="review-subtitle">{activeReview.sub}</div>
              <div className="review-byline-row">
                <div className="review-byline">
                  By <strong>Edward</strong> &nbsp;·&nbsp; {activeReview.date}
                </div>
                {tweaks.showScores && (
                  <div style={{textAlign: "right"}}>
                    <div className="review-score-display">{activeReview.score}</div>
                    <div className="review-score-label">out of 10</div>
                  </div>
                )}
              </div>

              {activeReview.image_url
                ? <img src={activeReview.image_url} alt={activeReview.title} className="review-hero-image" />

                    <span style={{fontFamily:"var(--sans)",fontSize:10,letterSpacing:"0.1em",textTransform:"uppercase",color:"var(--ink-light)"}}>

                  <dt>Year</dt>
                  <dd>{activeReview.year}</dd>

                <div className="aside-section">

                    <div key={r.id} className="you-might-like-item" onClick={() => goReview(r)}>
                      <div className="yml-thumb" />
                      <div>
                        <div className="yml-title">{r.title}</div>

      {/* ── ABOUT ── */}

            <span onClick={goHome}>Home</span>
            <span className="sep">—</span>
            <span>About</span>
          </div>
          <div className="about-layout">
            <div className="about-kicker">About</div>
            <h1 className="about-title">A few words</h1>
            <hr className="about-rule" />
            <div className="about-body">
              <p>
                This started as a way to keep track of things. Not in a journalistic sense, more like how you might dog-ear a page or leave a record on the wrong side of the sleeve. I watch a lot of movies, listen to a lot of music, read books slowly, and occasionally buy furniture I probably shouldn't. When something lands, I want to know why. When something doesn't, I want to know that too. Writing it down is the only way I've found to actually figure it out. The scores are there because I like having a number to argue with, and I won't be explaining them further than that.
              </p>
              <p>
                I'm Edward, from San Diego. I don't have a specialty. That's sort of the point. A chair shows up in a film. A film gets referenced in a song. A song becomes the whole mood of a novel. Culture doesn't sort itself into categories and I've stopped trying to sort it either. What I care about most, across all of it, is originality. Something that makes you feel like you've seen the world slightly differently than you did before you started. That's worth a lot around here. This is mostly a personal record, but I hope some of it starts a conversation.

            </div>
            <div className="about-footer-line">
              <div className="about-sig">— Edward, San Diego</div>
              <a
                className="about-linkedin"
                href="https://www.linkedin.com/in/edward-g-torres/"
                target="_blank"
                rel="noopener noreferrer"
              >LinkedIn</a>
            </div>
          </div>
        </>
      )}

      {/* ── WRITE REVIEW ── */}
      {page === "write" && (
        <>
          <div className="breadcrumb">
            <span onClick={goHome}>Home</span>
            <span className="sep">—</span>
            <span>Write Review</span>
          </div>

            ? <WriteReviewPage onSuccess={handleReviewPublished} onCancel={goHome} />

      {searchOpen && (

            <div className="search-input-row">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" style={{color:"var(--ink-faint)"}}>
                <circle cx="7.5" cy="7.5" r="5.5"/>
                <line x1="11.5" y1="11.5" x2="16" y2="16"/>
              </svg>
              <input
                ref={searchInputRef}
                className="search-input"
                placeholder="Search reviews…"
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
              />
              <button className="search-close" onClick={closeSearch}>Close</button>
            </div>

            {searchQuery.trim().length === 0 && (
              <div className="search-hint">Search by title, author, category…</div>

            {searchQuery.trim().length > 0 && searchResults.length === 0 && (

            {searchResults.length > 0 && (
              <div className="search-results">
                {searchResults.map(r => (
                  <div key={r.id} className="search-result-item" onClick={() => { goReview(r); closeSearch(); }}>
                    <div>
                      <div className="sr-cat">{r.cat}</div>
                      <div className="sr-title">{r.title}</div>
                      <div className="sr-sub">{r.sub}</div>

                    {tweaks.showScores && <div className="sr-score">{r.score}</div>}
                  </div>
                ))}
              </div>

          </div>
        </div>
      )}

        {/* San Diego line illustration */}

          <svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg" style={{strokeLinecap:"round", strokeLinejoin:"round"}}>
            {/* Sky / background */}
            <rect width="1440" height="320" fill="var(--cream)"/>

            {/* === WATER === */}
            <g stroke="#1a1714" strokeWidth="0.5" fill="none" opacity="0.35">
              <path d="M0 255 Q180 250 360 255 Q540 260 720 254 Q900 248 1080 255 Q1260 262 1440 255"/>
              <path d="M0 263 Q200 258 400 264 Q600 270 800 262 Q1000 254 1200 262 Q1320 266 1440 262"/>

              <path d="M0 300 Q300 293 600 301 Q850 308 1100 299 Q1280 292 1440 300"/>
              <path d="M0 310 Q350 303 700 311 Q1000 318 1300 309 Q1380 307 1440 310"/>
              <path d="M0 320 Q400 312 800 320 Q1100 326 1440 320"/>
            </g>

            {/* === CORONADO BRIDGE (left side, sweeping arc) === */}
            <g stroke="#1a1714" strokeWidth="1.2" fill="none">
              {/* Main bridge deck */}
              <path d="M0 230 Q80 200 180 185 Q280 170 400 195 Q480 210 540 235"/>
              <path d="M0 236 Q80 206 180 191 Q280 176 400 201 Q480 216 540 241"/>
              {/* Bridge supports / pylons */}
              <line x1="120" y1="215" x2="120" y2="255"/>
              <line x1="116" y1="215" x2="124" y2="215"/>
              <line x1="116" y1="255" x2="124" y2="255"/>
              <line x1="220" y1="195" x2="220" y2="255"/>
              <line x1="216" y1="195" x2="224" y2="195"/>
              <line x1="320" y1="188" x2="320" y2="255"/>
              <line x1="316" y1="188" x2="324" y2="188"/>
              <line x1="420" y1="200" x2="420" y2="255"/>
              <line x1="416" y1="200" x2="424" y2="200"/>
              {/* Bridge railings */}
              <path d="M0 233 Q80 203 180 188 Q280 173 400 198 Q480 213 540 238" strokeWidth="0.4" strokeDasharray="4,4"/>

            <g stroke="#1a1714" fill="var(--cream)">
